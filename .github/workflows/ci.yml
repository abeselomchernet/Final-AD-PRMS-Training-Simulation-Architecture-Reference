name: CI — Lint, Unit, Build, PostgreSQL 16 WP-2 & E2E

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit:
    name: TypeCheck, Vitest & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pre-build health & environment check
        run: bash ./check-health.sh --mode frontend

      - name: TypeScript type-check
        run: npm run lint

      - name: Compile-check Django backend Python sources
        run: python3 -m compileall -q backend

      - name: Run unit & HTTP security tests (Vitest)
        run: |
          mkdir -p ci-reports
          npx vitest run --reporter=default --reporter=junit --outputFile=ci-reports/vitest-junit.xml

      - name: Build production bundle
        run: npm run build

      - name: Upload dist build & Vitest report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-and-vitest-reports
          path: |
            dist
            ci-reports/vitest-junit.xml
          retention-days: 14

  backend-postgres-wp2:
    name: Django Checks, PG 16 Migrations, WP-2 RLS & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adprms_admin
          POSTGRES_PASSWORD: wp2_admin_password
          POSTGRES_DB: adprms
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U adprms_admin -d adprms"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 & PostgreSQL client
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL 16 client tools & backend requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client openssl
          pip install -r backend/requirements.txt

      - name: Bootstrap WP-2 roles before migrations (order-independent check)
        env:
          PGPASSWORD: wp2_admin_password
        run: |
          mkdir -p ci-reports
          psql -h 127.0.0.1 -U adprms_admin -d adprms -v ON_ERROR_STOP=1 -f backend/postgres/init_wp2_roles.sql

      - name: Pre-migration PostgreSQL & environment health check
        env:
          DATABASE_URL: postgres://adprms_admin:wp2_admin_password@127.0.0.1:5432/adprms
          DJANGO_SECRET_KEY: ci-verification-secret-key-not-prod
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: bash ./check-health.sh --mode postgres

      - name: Django system check & migration graph validation against PG 16
        working-directory: backend
        env:
          DATABASE_URL: postgres://adprms_admin:wp2_admin_password@127.0.0.1:5432/adprms
          DJANGO_SECRET_KEY: ci-verification-secret-key-not-prod
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: |
          python3 manage.py check --fail-level WARNING
          python3 manage.py makemigrations --check --dry-run
          python3 manage.py migrate --noinput | tee ../ci-reports/pg-migrate.log
          python3 manage.py migrate governance 0001_initial --noinput
          python3 manage.py migrate ledger 0001_initial --noinput
          python3 manage.py migrate --noinput

      - name: Re-apply WP-2 restricted role grants after migration
        env:
          PGPASSWORD: wp2_admin_password
        run: |
          psql -h 127.0.0.1 -U adprms_admin -d adprms -v ON_ERROR_STOP=1 -f backend/postgres/init_wp2_roles.sql

      - name: Run WP-2 PostgreSQL 16 validation as restricted adprms_app role (NOBYPASSRLS)
        working-directory: backend
        env:
          DATABASE_URL: postgres://adprms_app:CHANGE_ME_APP_PASS@127.0.0.1:5432/adprms
        run: |
          python3 scripts/verify_wp2_postgres.py | tee ../ci-reports/wp2-postgres-report.txt

      - name: Prepare isolated test_adprms DB and run pytest as restricted adprms_app role
        env:
          PGPASSWORD: wp2_admin_password
          DJANGO_SECRET_KEY: ci-verification-secret-key-not-prod
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: |
          psql -h 127.0.0.1 -U adprms_admin -d adprms -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS test_adprms;"
          psql -h 127.0.0.1 -U adprms_admin -d adprms -v ON_ERROR_STOP=1 -c "CREATE DATABASE test_adprms OWNER adprms_admin;"
          psql -h 127.0.0.1 -U adprms_admin -d test_adprms -v ON_ERROR_STOP=1 -f backend/postgres/init_wp2_roles.sql
          DATABASE_URL=postgres://adprms_admin:wp2_admin_password@127.0.0.1:5432/test_adprms python3 backend/manage.py migrate --noinput
          psql -h 127.0.0.1 -U adprms_admin -d test_adprms -v ON_ERROR_STOP=1 -f backend/postgres/init_wp2_roles.sql
          cd backend
          DATABASE_URL=postgres://adprms_app:CHANGE_ME_APP_PASS@127.0.0.1:5432/test_adprms DJANGO_USE_PREMIGRATED_TEST_DB=true pytest -v --junitxml=../ci-reports/backend-postgres-junit.xml

      - name: Run distinct SQLite Django pytest suite (separate from PostgreSQL evidence)
        working-directory: backend
        env:
          DATABASE_URL: ''
          DJANGO_SECRET_KEY: ci-sqlite-test-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: |
          pytest -v --junitxml=../ci-reports/backend-sqlite-junit.xml

      - name: Run encrypted backup, restore & reconciliation drill on PG 16
        env:
          PGPASSWORD: wp2_admin_password
          DATABASE_URL: postgres://adprms_admin:wp2_admin_password@127.0.0.1:5432/adprms
          VERIFY_RESTORE_DATABASE_URL: postgres://adprms_admin:wp2_admin_password@127.0.0.1:5432/restore_verify_db
          BACKUP_ENCRYPTION_PASSPHRASE: ci-drill-passphrase-not-embedded
          BACKUP_ENCRYPTION_KEY_ID: ci-ephemeral-key-01
          BACKUP_DIR: ci-reports/backups
        run: |
          set -eo pipefail
          psql -h 127.0.0.1 -U adprms_admin -d adprms -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS restore_verify_db;"
          psql -h 127.0.0.1 -U adprms_admin -d adprms -v ON_ERROR_STOP=1 -c "CREATE DATABASE restore_verify_db OWNER adprms_admin;"
          bash ./backend/scripts/backup_and_restore_drill.sh | tee ci-reports/restore-drill.log

      - name: Upload PostgreSQL 16, migration, WP-2 & restore artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-wp2-and-pytest-reports
          path: ci-reports
          retention-days: 14

  e2e-playwright:
    name: Playwright Chromium E2E (Security, UI & Offline/LAN)
    runs-on: ubuntu-latest
    needs: quality-and-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-and-vitest-reports
          path: .

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests against production preview
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
